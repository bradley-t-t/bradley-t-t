<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240" role="img" aria-label="Language fluency chart">
  <title>Language fluency chart</title>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
    <!-- Java -->
    <text x="2" y="19" fill="#e6edf3" font-weight="500">Java</text>
    <rect x="92" y="10" width="356" height="10" rx="5" fill="#30363d"/>
    <rect x="92" y="10" width="356" height="10" rx="5" fill="#b07219"/>
    <text x="496" y="19" fill="#9198a1" text-anchor="end">100%</text>
    <!-- HTML -->
    <text x="2" y="49" fill="#e6edf3" font-weight="500">HTML</text>
    <rect x="92" y="40" width="356" height="10" rx="5" fill="#30363d"/>
    <rect x="92" y="40" width="284.8" height="10" rx="5" fill="#e34c26"/>
    <text x="496" y="49" fill="#9198a1" text-anchor="end">80%</text>
    <!-- CSS -->
    <text x="2" y="79" fill="#e6edf3" font-weight="500">CSS</text>
    <rect x="92" y="70" width="356" height="10" rx="5" fill="#30363d"/>
    <rect x="92" y="70" width="284.8" height="10" rx="5" fill="#663399"/>
    <text x="496" y="79" fill="#9198a1" text-anchor="end">80%</text>
    <!-- TypeScript -->
    <text x="2" y="109" fill="#e6edf3" font-weight="500">TypeScript</text>
    <rect x="92" y="100" width="356" height="10" rx="5" fill="#30363d"/>
    <rect x="92" y="100" width="106.8" height="10" rx="5" fill="#3178c6"/>
    <text x="496" y="109" fill="#9198a1" text-anchor="end">30%</text>
    <!-- JavaScript -->
    <text x="2" y="139" fill="#e6edf3" font-weight="500">JavaScript</text>
    <rect x="92" y="130" width="356" height="10" rx="5" fill="#30363d"/>
    <rect x="92" y="130" width="178" height="10" rx="5" fill="#f1e05a"/>
    <text x="496" y="139" fill="#9198a1" text-anchor="end">50%</text>
    <!-- Python -->
    <text x="2" y="169" fill="#e6edf3" font-weight="500">Python</text>
    <rect x="92" y="160" width="356" height="10" rx="5" fill="#30363d"/>
    <rect x="92" y="160" width="106.8" height="10" rx="5" fill="#3572A5"/>
    <text x="496" y="169" fill="#9198a1" text-anchor="end">30%</text>
    <!-- SQL -->
    <text x="2" y="199" fill="#e6edf3" font-weight="500">SQL</text>
    <rect x="92" y="190" width="356" height="10" rx="5" fill="#30363d"/>
    <rect x="92" y="190" width="178" height="10" rx="5" fill="#e38c00"/>
    <text x="496" y="199" fill="#9198a1" text-anchor="end">50%</text>
    <!-- Go -->
    <text x="2" y="229" fill="#e6edf3" font-weight="500">Go</text>
    <rect x="92" y="220" width="356" height="10" rx="5" fill="#30363d"/>
    <rect x="92" y="220" width="35.6" height="10" rx="5" fill="#00ADD8"/>
    <text x="496" y="229" fill="#9198a1" text-anchor="end">10%</text>
  </g>
</svg>
